# Local smoke only: short, capped runs; not a formal training config.
data:
  package_root: null
  processed_root: null
  dtype: float32
  verify_hash: true
training:
  seeds: [20261125]
  batch_size: 2
  epochs: 1
  lr: 0.001
  weight_decay: 0.0
  early_stopping_patience: 5
  min_delta: 0.0
  grad_clip: 5.0
  selection_metric: three_slice_graph_equal_task_equal_component_equal_normalized_mse
  physics_loss_weight: 0.0
  max_train_batches_per_epoch: 2
  val_batch_size: 1
  diagnostic: false
  device: cpu
models:
  mlp:
    hidden_dims: [32, 16]
    dropout: 0.0
    activation: relu
    use_batch_norm: false
  hgt_global:
    hidden_dim: 32
    num_layers: 1
    heads: 4
    dropout: 0.1
    activation: relu
    use_layer_norm: true
    decoder_hidden_dims: [16, 8]
    global_mode: mesh_global
    global_fusion: gated_residual
  hgt:
    hidden_dim: 32
    num_layers: 1
    heads: 4
    dropout: 0.1
    activation: relu
    use_layer_norm: true
    decoder_hidden_dims: [16, 8]
  rgcn:
    hidden_dim: 32
    num_layers: 1
    dropout: 0.1
    activation: relu
    use_layer_norm: true
    decoder_hidden_dims: [16, 8]
  gcn:
    hidden_dim: 32
    num_layers: 1
    dropout: 0.1
    activation: relu
    use_batch_norm: false
    decoder_hidden_dims: [16, 8]
    use_type_embed: true
  gat:
    hidden_dim: 32
    num_layers: 1
    gat_heads: 4
    dropout: 0.1
    activation: relu
    use_batch_norm: false
    decoder_hidden_dims: [16, 8]
    use_type_embed: true
  graphsage:
    hidden_dim: 32
    num_layers: 1
    dropout: 0.1
    activation: relu
    use_batch_norm: false
    decoder_hidden_dims: [16, 8]
    use_type_embed: true
    aggr: mean
  gin:
    hidden_dim: 32
    num_layers: 1
    dropout: 0.1
    activation: relu
    use_batch_norm: false
    decoder_hidden_dims: [16, 8]
    use_type_embed: true
    train_eps: true
ml:
  ridge:
    alpha: 1.0
  hist_gb:
    max_iter: 10
    learning_rate: 0.1
    max_depth: null
smoke:
  train_samples_per_template: 4
  val_samples_per_slice: 2
  ml_train_samples: 16
  ml_val_samples: 4
