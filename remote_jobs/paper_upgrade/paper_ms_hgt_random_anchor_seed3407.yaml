# =============================================================================
# paper_ms_hgt_random_anchor_seed3407.yaml — Paper-upgrade multi-seed wave:
#   MS-HGT random-fixed anchors seed=3407
#
# Purpose:
#   Third training seed for the random-anchor ablation (after 42, 2026).
#   Complements paper_ms_hgt_random_anchor_seed42.yaml.
#
# IMPORTANT (design choice, see the seed42 file):
#   anchor_seed STAYS 42 even though the training seed is 3407. The fixed
#   random partition must be IDENTICAL across all training seeds so that the
#   coordinate-vs-random ablation isolates the ASSIGNMENT, not partition noise.
#   Only training RNG varies with --seed.
#
# Model config:
#   --model ms_hgt_random_anchor -> configs/paper_upgrade/ms_hgt_random_anchor.yaml
#
# Run with:
#   bash server_ops/run_job.sh remote_jobs/paper_upgrade/paper_ms_hgt_random_anchor_seed3407.yaml
# =============================================================================

model: "ms_hgt_random_anchor"

dataset: "processed/hetero_graph_dataset_v2"
split_mode: "by_sample"

device: "cuda"
num_workers: 4

epochs: 200
batch_size: 8

seed: 3407

model_config:
  anchor_mode: "random_fixed"
  anchor_seed: 42

run_name: "paper_ms_hgt_random_anchor_seed3407"

save_best_model: true
save_last_model: true

package_artifact: true
