# =============================================================================
# paper_hgt_3_seed2026.yaml — Paper-upgrade multi-seed wave: HGT-3 seed=2026
#
# Purpose:
#   Second training seed for the core HGT backbone (HGT-3). Part of the 3-seed
#   (42 / 2026 / 3407) statistical-stability run required by the paper-upgrade
#   matrix. seed42 HGT-3 already exists in prior runs.
#
# Model config:
#   --model hgt  ->  configs/models_baseline.yaml -> hgt (num_layers=3)
#
# batch_size=8 matches the HGT-3 reference run.
#
# Run with:
#   bash server_ops/run_job.sh remote_jobs/paper_upgrade/paper_hgt_3_seed2026.yaml
# =============================================================================

model: "hgt"

dataset: "processed/hetero_graph_dataset_v2"
split_mode: "by_sample"

device: "cuda"
num_workers: 4

epochs: 200
batch_size: 8

seed: 2026

run_name: "paper_hgt_3_seed2026"

save_best_model: true
save_last_model: true

package_artifact: true
