# =============================================================================
# paper_edge_aware_mpnn_seed2026.yaml — Paper-upgrade second wave:
#   Edge-aware MPNN (MeshGraphNet-style), seed 2026
#
# Purpose:
#   Second training seed for the edge-aware MPNN baseline. Part of the 3-seed
#   (42 / 2026 / 3407) statistical-stability run.
#
# Model config:
#   --model edge_aware_mpnn -> configs/paper_upgrade/edge_aware_mpnn.yaml
#
# Run with:
#   bash server_ops/run_job.sh remote_jobs/paper_upgrade/paper_edge_aware_mpnn_seed2026.yaml
# =============================================================================

model: "edge_aware_mpnn"

dataset: "processed/hetero_graph_dataset_v2"
split_mode: "by_sample"

device: "cuda"
num_workers: 4

epochs: 200
batch_size: 8

seed: 2026

model_config:
  hidden_dim: 128
  num_layers: 6
  use_edge_attr: true
  use_type_embedding: true
  aggr: "sum"

run_name: "paper_edge_aware_mpnn_seed2026"

save_best_model: true
save_last_model: true

package_artifact: true
